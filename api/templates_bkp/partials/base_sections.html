{% load static %}
<section class="h-[17.5vh] max-h-[17.5vh] bg-white/40 rounded-lg p-2 border border-gray-200/60 flex flex-col justify-between">
    <div class="flex justify-between items-center mb-1 border-b border-gray-200 pb-0.5">
        <h2 class="text-xs font-bold text-[var(--star-navy)] uppercase tracking-wider flex items-center gap-1.5">
            <span class="h-2 w-2 rounded bg-blue-600 inline-block"></span>
                {% block titulo %}{% endblock %}
            <span class="text-[var(--star-gold)] font-mono text-[10px] normal-case font-normal">
                {% block subtitulo %}{%endblock%}
            </span>
        </h2>
        <span class="text-[10px] font-mono bg-blue-100 text-blue-800 px-1.5 py-0.2 rounded font-bold">
            {% block ambiente %}{%endblock%}
        </span>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-2 flex-1 items-center">
        {% block cards %}

        {% endblock %}
    </div>
    
</section>
