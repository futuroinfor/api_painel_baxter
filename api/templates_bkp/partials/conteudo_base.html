
<div class="panel-card shadow-sm">
    <div class="flex justify-between items-start">
    <div>
        <h3 class="font-bold text-base text-[#0a192f] tracking-tight">{{ painel.descricao }}</h3>
        <p class="text-[11px] font-bold text-[#c5a059] uppercase mt-0.5">{{ painel.hostname|escape }}</p>
    </div>
    <!-- Luz indicadora verde para representar estabilidade online -->
    <span class="status-dot status-online"></span>
    </div>
    
        {% if painel.paineis|slice:":3" %}
            <div class="flex flex-col items-center gap-1 text-[10px] font-bold text-white">
                <span class="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent shrink-0 {% if painel.monitor_1.prefixo in painel.paineis %} border-b-[6px] border-b-[var(--star-success)]  {% else %} border-t-[6px] border-t-[var(--star-danger)] animate-pulse {% endif %} mt-0.5"></span>
                <span class="bg-[var(--star-navy)] px-1 rounded-[2px] text-[10px]">{{ painel.paineis|slice:":3" }}</span>   
            </div>
        {% endif %}
        

        {% if painel.paineis|slice:"4:" %}
            <div class="flex flex-col items-center gap-1 text-[10px] font-bold text-white">
                <span class=" w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent shrink-0 {% if painel.monitor_2.prefixo in painel.paineis %} border-b-[6px] border-b-[var(--star-success)]  {% else %} border-t-[6px] border-t-[var(--star-danger)] animate-pulse {% endif %} mt-0.5"></span>
                <span class="bg-[var(--star-gold)] px-1 rounded-[2px] text-[10px]">{{ painel.paineis|slice:"4:" }}</span>   
            </div>
        {% endif %}

    <div class="mt-4 pt-2 border-t border-gray-100 text-[11px] text-gray-500 font-medium">
    <div>Log: 2026-09-16 08:57:37</div>
    <div class="text-[#10b981] font-bold mt-0.5">Att: 09:19:40 • ONLINE</div>
    </div>
</div>
