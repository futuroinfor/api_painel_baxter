{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painéis Star - Central de Monitoramento Responsiva</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/paineis_star.css' %}">
</head>

<body class="h-screen w-screen p-3 flex flex-col justify-between select-none">

    <header class="h-[7vh] flex justify-between items-center bg-[var(--star-navy)] px-4 py-2 rounded-lg shadow-md border border-[var(--star-gold)]/20 mb-2">
        <!-- Bloco do Logo Institucional à esquerda -->
        <div class="flex items-center gap-3">

            <!-- Estrela animada ao lado da LOGO Memorial Star -->
            <span class="text-[var(--star-gold)] text-2xl font-bold animate-pulse">★</span>
            <div class="flex flex-col">
                <!-- Nome da instituição principal -->
                <span class="text-white font-bold text-base tracking-wide leading-none"></span>
                <!-- LOGO do Memorial Star-->
                <span class="text-[var(--star-gold)] text-[10px] font-semibold uppercase tracking-wider mt-0.5">
                    <img src="https://wp.rededorsaoluiz.com.br/wp-content/uploads/sites/95/2025/01/10886-Logo-Memorial-Star-BRANCO.svg" style="height: 25px; width: auto;" alt="Logo">
                </span>
            </div>
        </div>

        <!-- Bloco do Relógio em Tempo Real -->
        <div class="flex items-center gap-2 bg-black/30 px-3 py-1.5 rounded-md border border-white/10">

            <!-- Título oficial da aplicação -->
            <h1 class="text-white font-bold text-sm tracking-tight">Monitoramento dos Painéis </h1>
        </div>
        <!-- Bloco à direita -->
        <div class="flex items-center gap-4 text-xs">
            <!-- exibição de Hora no top da página -->
            <div class="bg-[var(--star-gold)] text-[var(--star-navy)] font-bold px-2 py-1 rounded text-[10px] uppercase tracking-wider">
               

                <div id="current-time" class="font-mono text-[15px] opacity-80">00:00:00</div>


            </div>
        </div>

        <script src="{% static 'js/clock.js' %}"></script>


    </header>

    
        <div class="panel-grid" id="main-grid">
            {% include "partials/linhas_tabela.html" %}
        </div>
      


    </main>
        <script>

        const grid = document.getElementById('main-grid');

        function atualizarPainel() {
            fetch('/dashboard/linhas/', {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                if (!response.ok) throw new Error('Erro na requisição dos dados do painel');
                return response.text();
            })
            .then(html => {
                grid.innerHTML = html;
            })
            .catch(error => {
                console.error('Erro ao atualizar via AJAX:', error);
            })
            .finally(() => {
                setTimeout(atualizarPainel, 10000);
            });
        }

        setTimeout(atualizarPainel, 10000);

        function clock() {
            document.getElementById('current-time').innerText = new Date().toLocaleTimeString('pt-BR');
        }
        setInterval(clock, 1000);
        clock();
    </script>

    
    
</body>
</html>
